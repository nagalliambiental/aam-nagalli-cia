name: Movimentações SEI diário

on:
  schedule:
    - cron: "0 11 * * *" # 08h de Brasília (após o DOU)
  workflow_dispatch: {}

jobs:
  movimentacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Sincronizar (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            if npx tsx worker/movimentacoes.ts; then
              exit 0
            fi
            echo "tentativa ${tentativa} falhou (pode ser rede/Neon); aguardando 60s antes de repetir"
            sleep 60
          done
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
