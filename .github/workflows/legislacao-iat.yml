name: Legislação IAT

on:
  schedule:
    - cron: "0 9 * * *" # 06h de Brasília (contorna atraso do agendador do GitHub)
    - cron: "0 17 * * *" # 14h de Brasília - segunda tentativa do dia
  workflow_dispatch: {}

jobs:
  legislacao-iat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Sincronizar (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            if npx tsx worker/legislacao-iat.ts; then
              exit 0
            fi
            echo "tentativa ${tentativa} falhou; aguardando 60s antes de repetir"
            sleep 60
          done
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
