name: Legislação IAT

on:
  schedule:
    - cron: "0 12 * * *" # 09h de Brasília
  workflow_dispatch: {}

jobs:
  legislacao-iat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx worker/legislacao-iat.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
